<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check</title>
  <style>
    :root {
      --ink: #1c2430;
      --muted: #667085;
      --good: #157a42;
      --bad: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      color: var(--ink);
      background: #f7f4ee;
    }

    main {
      width: min(720px, calc(100% - 40px));
      margin: 0 auto;
      padding: 36px 0 72px;
    }

    .count {
      margin: 0 0 12px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    h1 {
      margin: 0 0 28px;
      font-size: clamp(1.85rem, 4.5vw, 2.6rem);
      line-height: 1.2;
      font-weight: 700;
    }

    h1.score {
      margin: 0;
      font-size: clamp(4.5rem, 14vw, 7.5rem);
      line-height: 1;
    }

    .choices { display: grid; gap: 4px; }

    button.choice {
      display: grid;
      grid-template-columns: 1.5em 2em 1fr;
      gap: 8px;
      align-items: baseline;
      width: 100%;
      text-align: left;
      font: inherit;
      font-size: clamp(1.35rem, 3vw, 1.7rem);
      line-height: 1.35;
      padding: 12px 4px;
      border: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
    }

    button.choice:hover { background: rgba(255, 255, 255, 0.55); }

    button.choice:focus-visible {
      outline: 3px solid #1f4e46;
      outline-offset: 2px;
    }

    .letter { font-weight: 700; }

    button.choice.right { color: var(--good); }
    button.choice.wrong { color: var(--bad); }
    button.choice:disabled { cursor: default; }
    button.choice:disabled:hover { background: transparent; }

    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 8;
    }

    .popup {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      align-items: end;
      justify-content: center;
      padding: 24px;
      background: rgba(28, 36, 48, 0.28);
    }

    .popup[hidden] { display: none; }

    .sheet {
      width: min(720px, 100%);
      margin: 0;
      padding: 28px 8px 12px;
      background: #fffdf8;
      border-radius: 18px;
    }

    .sheet p {
      margin: 0 0 8px;
      font-size: clamp(1.35rem, 3vw, 1.75rem);
      line-height: 1.35;
    }

    .sheet button {
      font: inherit;
      font-size: 1.35rem;
      font-weight: 700;
      color: #1f4e46;
      background: transparent;
      border: 0;
      padding: 12px 0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <p class="count" id="count"></p>
    <h1 id="question"></h1>
    <div class="choices" id="choices"></div>
  </main>
  <canvas id="fx"></canvas>
  <div class="popup" id="popup" hidden>
    <div class="sheet">
      <p id="explain"></p>
      <button type="button" id="next">Next</button>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    const letters = ["A.", "B.", "C.", "D."];
    const questions = [
      {
        q: "What does the school vision say LA wants to give future leaders?",
        choices: [
          ["🎓", "Quality education the community looks up to"],
          ["🎓", "Quality teaching the families can rely on"],
          ["🎓", "Strong results the community can measure"],
          ["🎓", "Caring support the community can trust"]
        ],
        answer: 0,
        why: "The vision is quality education for future leaders, and a school the community can look up to."
      },
      {
        q: "The mission says Christian education helps students act with what?",
        choices: [
          ["🤝", "Kindness and patience"],
          ["🤝", "Integrity and honesty"],
          ["🤝", "Courage and respect"],
          ["🤝", "Effort and humility"]
        ],
        answer: 1,
        why: "Christian education is how the school grows character, so students act with integrity and honesty."
      },
      {
        q: "Students should know Chinese culture, think internationally, and build what?",
        choices: [
          ["📚", "Skills for further study"],
          ["📚", "Habits for group projects"],
          ["📚", "Abilities for lifelong learning"],
          ["📚", "Strength for the next stage"]
        ],
        answer: 2,
        why: "Students should know Chinese culture, think internationally, and build abilities they can use for life."
      },
      {
        q: "What is the school motto?",
        choices: [
          ["💛", "Love hopes all things, endures all things"],
          ["💛", "Love bears all things, believes all things"],
          ["💛", "Love bears all things, hopes all things"],
          ["💛", "Love believes all things, endures all things"]
        ],
        answer: 1,
        why: "The motto is “Love bears all things, believes all things.” In Chinese: 凡事包容，凡事相信。"
      },
      {
        q: "Where does the motto come from?",
        choices: [
          ["📖", "1 Corinthians 13:4"],
          ["📖", "1 Corinthians 13:13"],
          ["📖", "1 John 4:7"],
          ["📖", "1 Corinthians 13:7"]
        ],
        answer: 3,
        why: "That line is from 1 Corinthians 13:7, 哥林多前書 13章7節."
      },
      {
        q: "What time are the morning worship, reading, and homeroom slots?",
        choices: [
          ["🕗", "08:50–08:55"],
          ["🕗", "08:40–08:50"],
          ["🕗", "08:55–09:05"],
          ["🕗", "08:45–08:55"]
        ],
        answer: 0,
        why: "Worship, reading, and homeroom in the morning all sit in the 08:50–08:55 slot."
      },
      {
        q: "What is Monday at 08:50–08:55?",
        choices: [
          ["📚", "Drop Everything And Read"],
          ["📝", "Chapel message reflection"],
          ["🏫", "Whole-school Worship"],
          ["🚩", "Flag-raising ceremony"]
        ],
        answer: 2,
        why: "Monday at 08:50–08:55 is whole-school worship."
      },
      {
        q: "Why are the seats arranged as islands?",
        choices: [
          ["🔇", "To help each student work quietly alone"],
          ["👥", "To help students engage in group discussion"],
          ["👀", "To help the teacher watch every screen"],
          ["🚪", "To help the class leave the room faster"]
        ],
        answer: 1,
        why: "Island groups let students face one another and take part in group discussion."
      },
      {
        q: "What are the class expectations?",
        choices: [
          ["🗓️", "Weekly calendar, phones in bags"],
          ["🔕", "Daily calendar, phones on silent"],
          ["📅", "Daily calendar, phones in lockers"],
          ["📆", "Weekly calendar, phones in lockers"]
        ],
        answer: 2,
        why: "Students check Google Calendar every day, and phones go into the lockers as soon as they arrive."
      },
      {
        q: "What are the homeroom essential agreements?",
        choices: [
          ["🤝", "Think first, no phones, offer help"],
          ["🤝", "Listen first, no gaming, offer help"],
          ["🤝", "Think first, no gaming, take turns"],
          ["🤝", "Think first, no gaming, offer help"]
        ],
        answer: 3,
        why: "Think before you speak, no gaming, and offer help. Respect and no playfighting sit with those."
      }
    ];

    const countEl = document.getElementById("count");
    const questionEl = document.getElementById("question");
    const choicesEl = document.getElementById("choices");
    const popup = document.getElementById("popup");
    const explainEl = document.getElementById("explain");
    const nextBtn = document.getElementById("next");
    let index = 0;
    let attempts = 0;
    let showingScore = false;
    const solved = questions.map(() => false);
    const missed = questions.map(() => []);

    function closeExplain() {
      popup.hidden = true;
    }

    function openExplain() {
      explainEl.textContent = questions[index].why;
      popup.hidden = false;
      nextBtn.focus();
    }

    function showScore() {
      showingScore = true;
      closeExplain();
      const accuracy = Math.round(questions.length / attempts * 100);
      countEl.textContent = questions.length + " / " + attempts;
      questionEl.className = "score";
      questionEl.textContent = accuracy + "%";
      choicesEl.innerHTML = "";
    }

    function showQuestion() {
      showingScore = false;
      const item = questions[index];
      const done = solved[index];
      const misses = missed[index];
      questionEl.className = "";
      countEl.textContent = (index + 1) + " / " + questions.length;
      questionEl.textContent = item.q;
      choicesEl.innerHTML = "";

      item.choices.forEach(([emoji, text], choiceIndex) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice";

        const icon = document.createElement("span");
        icon.textContent = emoji;
        const letter = document.createElement("span");
        letter.className = "letter";
        letter.textContent = letters[choiceIndex];
        const label = document.createElement("span");
        label.textContent = text;
        button.append(icon, letter, label);

        const wasWrong = misses.includes(choiceIndex);
        if (done || wasWrong) button.disabled = true;
        if (done && choiceIndex === item.answer) button.classList.add("right");
        if (wasWrong) button.classList.add("wrong");

        button.addEventListener("click", () => {
          if (solved[index] || missed[index].includes(choiceIndex)) return;
          attempts += 1;
          if (choiceIndex === item.answer) {
            solved[index] = true;
            burst(button);
          } else missed[index].push(choiceIndex);
          showQuestion();
          if (solved[index]) openExplain();
        });
        choicesEl.appendChild(button);
      });
    }

    function move(step) {
      closeExplain();
      if (showingScore) {
        if (step < 0) {
          index = questions.length - 1;
          showQuestion();
        }
        return;
      }
      const next = index + step;
      if (next < 0) return;
      if (next >= questions.length) {
        if (attempts > 0) showScore();
        return;
      }
      index = next;
      showQuestion();
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight") {
        event.preventDefault();
        move(1);
      } else if (event.key === "ArrowLeft") {
        event.preventDefault();
        move(-1);
      }
    });

    nextBtn.addEventListener("click", () => move(1));

    function setupBurst(canvas) {
      if (!window.THREE) return function () {};
      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: true,
        premultipliedAlpha: false
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x000000, 0);
      canvas.style.opacity = "0";
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 40);
      camera.position.z = 9;

      const colors = [0x1f9d57, 0xe7c15a, 0xfff6d4];
      const groups = colors.map((color) => {
        const mesh = new THREE.InstancedMesh(
          new THREE.PlaneGeometry(0.22, 0.36),
          new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide, transparent: true, opacity: 0.95 }),
          16
        );
        mesh.frustumCulled = false;
        scene.add(mesh);
        const bits = [];
        for (let i = 0; i < 16; i++) {
          bits.push({
            p: new THREE.Vector3(),
            v: new THREE.Vector3(),
            rot: Math.random() * 6,
            spin: (Math.random() - 0.5) * 8
          });
        }
        return { mesh: mesh, bits: bits };
      });

      const glowCanvas = document.createElement("canvas");
      glowCanvas.width = glowCanvas.height = 128;
      const g = glowCanvas.getContext("2d");
      const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
      grd.addColorStop(0, "rgba(255,244,196,0.95)");
      grd.addColorStop(0.45, "rgba(255,210,90,0.35)");
      grd.addColorStop(1, "rgba(255,210,90,0)");
      g.fillStyle = grd;
      g.fillRect(0, 0, 128, 128);
      const glow = new THREE.Sprite(new THREE.SpriteMaterial({
        map: new THREE.CanvasTexture(glowCanvas),
        transparent: true,
        depthWrite: false
      }));
      glow.visible = false;
      scene.add(glow);

      const rings = [0x1f9d57, 0xe7c15a].map((color) => {
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(0.32, 0.38, 64),
          new THREE.MeshBasicMaterial({
            color: color,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false
          })
        );
        ring.visible = false;
        scene.add(ring);
        return ring;
      });

      const dummy = new THREE.Object3D();
      const origin = new THREE.Vector3();
      let raf = 0;
      let start = 0;

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function place(el) {
        const rect = el.getBoundingClientRect();
        const nx = ((rect.left + rect.width / 2) / window.innerWidth) * 2 - 1;
        const ny = -(((rect.top + rect.height / 2) / window.innerHeight) * 2 - 1);
        const viewH = 2 * Math.tan((camera.fov * Math.PI / 180) / 2) * camera.position.z;
        const viewW = viewH * camera.aspect;
        origin.set(nx * viewW / 2, ny * viewH / 2, 0);
      }

      function kick(el) {
        place(el);
        canvas.style.opacity = "1";
        start = performance.now();
        groups.forEach((group) => {
          group.bits.forEach((bit) => {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1.6 + Math.random() * 2.4;
            bit.p.copy(origin);
            bit.v.set(Math.cos(angle) * speed, 1.2 + Math.random() * 2.4, 0);
            bit.rot = Math.random() * 6;
          });
        });
        glow.visible = true;
        glow.position.copy(origin);
        glow.material.opacity = 0.85;
        glow.scale.setScalar(0.4);
        rings.forEach((ring, i) => {
          ring.visible = true;
          ring.position.copy(origin);
          ring.scale.setScalar(0.25 + i * 0.08);
          ring.material.opacity = 0.7;
        });
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(frame);
      }

      function frame(now) {
        const t = (now - start) / 1000;
        const dt = 1 / 60;
        if (t > 1.25) {
          glow.visible = false;
          rings.forEach((ring) => { ring.visible = false; });
          groups.forEach((group) => {
            group.bits.forEach((bit, i) => {
              dummy.position.copy(bit.p);
              dummy.scale.setScalar(0);
              dummy.updateMatrix();
              group.mesh.setMatrixAt(i, dummy.matrix);
            });
            group.mesh.instanceMatrix.needsUpdate = true;
          });
          canvas.style.opacity = "0";
          renderer.render(scene, camera);
          return;
        }
        groups.forEach((group) => {
          group.bits.forEach((bit, i) => {
            bit.v.y -= 4.2 * dt;
            bit.p.addScaledVector(bit.v, dt);
            bit.rot += bit.spin * dt;
            dummy.position.copy(bit.p);
            dummy.rotation.set(0, 0, bit.rot);
            const fade = Math.max(0, 1 - t / 1.15);
            dummy.scale.set(fade, fade * (0.85 + (i % 3) * 0.12), 1);
            dummy.updateMatrix();
            group.mesh.setMatrixAt(i, dummy.matrix);
          });
          group.mesh.instanceMatrix.needsUpdate = true;
        });
        glow.scale.setScalar(0.6 + t * 2.4);
        glow.material.opacity = Math.max(0, 0.8 - t * 0.9);
        rings.forEach((ring, i) => {
          ring.scale.setScalar(0.35 + t * (2.6 + i * 0.7));
          ring.material.opacity = Math.max(0, 0.65 - t * 0.55);
        });
        renderer.render(scene, camera);
        raf = requestAnimationFrame(frame);
      }

      return kick;
    }

    const burst = setupBurst(document.getElementById("fx"));

    showQuestion();
  </script>
</body>
</html>
